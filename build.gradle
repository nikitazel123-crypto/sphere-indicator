plugins {
    id 'fabric-loom' version '0.10-SNAPSHOT'
    id 'maven-publish'
}

sourceCompatibility = JavaVersion.VERSION_16
targetCompatibility = JavaVersion.VERSION_16

archivesBaseName = project.archives_base_name
version = project.mod_version
group = project.maven_group

repositories {
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
}

// ── Генерация placeholder-текстур ──────────────────────────────────────────
def textureOutDir = file("src/main/resources/assets/sphereindicator/textures/item")

task generateTextures {
    description = "Генерирует placeholder PNG-текстуры если их нет"
    def uron   = file("${textureOutDir}/sphere_uron3.png")
    def bronya = file("${textureOutDir}/sphere_bronya3.png")
    outputs.files(uron, bronya)
    onlyIf { !uron.exists() || !bronya.exists() }

    doLast {
        // Вызываем наш buildSrc-класс
        GenerateTextures.generate(textureOutDir)
        logger.lifecycle("Текстуры сгенерированы в ${textureOutDir}")
    }
}

processResources.dependsOn generateTextures
// ───────────────────────────────────────────────────────────────────────────

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 16
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.archivesBaseName}" }
    }
}
